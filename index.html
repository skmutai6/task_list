<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="script.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
</head>
<body>
    <div class="container">
        <h1 id="header">Task List</h1>
        <div id="currentDate"></div>
        <!-- DYNAMIC DATE -->
        <div id="newTask">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <button id="addTaskBtn">Add</button>
        </div>
        <div id="message" class="message" role="status" aria-live="polite"></div>
        <div id="taskList" class="taskList overflow"></div>

        <!-- Task Counts -->
        <div id="taskCount">
            <span id="totalTasks">Total Tasks: 0</span>
            <span id="pendingTasks">Pending Tasks: 0</span>
            <span id="completedTasks">Completed Tasks: 0</span>
            <span id="deletedTasks">Deleted Tasks: 0</span>
        </div>
        <!-- Clear Completed Button -->
        <div id="clearCompleted">
            <button id="clearCompletedBtn">Clear Completed</button> 
        </div>
        
    </div>
    <div class="footer">
        <p>Created by <a href="https://github.com/skmutai6">skmutai6</a></p>
    </div>
</body>
</html>
